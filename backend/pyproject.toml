[project]
name = "spellforge"
version = "0.0.1"
description = "A roguelike whose spells are written at runtime by a team of AI agents."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spellforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plugin sources get the plugin API injected as globals instead of importing it.
"spellforge/plugins/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
